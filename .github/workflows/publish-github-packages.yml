name: Publish GM artifact to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches:
      - gm-sm4-srtp

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven

      - name: Publish jitsi-srtp-gm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress -DskipTests deploy
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/stevenzxs/jitsi-srtp
