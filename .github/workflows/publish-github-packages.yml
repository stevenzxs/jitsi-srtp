name: Publish GM artifact to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches:
      - gm-sm4-srtp

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GH_PACKAGES_TOKEN
          cache: maven

      - name: Build jitsi-srtp-gm
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dcheckstyle.skip=true package

      - name: Publish jitsi-srtp-gm
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.apache.maven.plugins:maven-deploy-plugin:2.8.2:deploy
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/stevenzxs/jitsi-srtp
